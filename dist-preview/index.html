<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1c33" />
    <meta name="description" content="小小赛车 · 快乐卡丁车冒险 —— 为 6～8 岁小朋友设计的 3D 卡通卡丁车游戏。" />
    <!-- Lets the game run chrome-free when added to an iOS home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="小小赛车" />
    <!-- PWA：manifest 用相对路径，GitHub Pages 项目子路径下也能装；
         start_url / scope 都是 "./"，换目录不用改。
         iOS 用 apple-touch-icon 作为主屏幕图标（不支持 manifest 里的 icons）。 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffd23f'/%3E%3Cpath d='M5 21h22l-3 5H8z' fill='%23e23b2e'/%3E%3Ccircle cx='11' cy='25' r='3' fill='%23222'/%3E%3Ccircle cx='21' cy='25' r='3' fill='%23222'/%3E%3Cpath d='M10 15h12l3 5H7z' fill='%23e23b2e'/%3E%3Cpath d='M13 11h6l2 4H11z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>小小赛车 · 快乐卡丁车冒险</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking paint: if Google Fonts is unreachable (common on
         mainland networks) the boot screen still draws instantly with the local
         font stack instead of waiting on a timeout. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script type="module" src="./r5/race-guard.mjs?v=1.6.3"></script><!-- r5-guard -->
    <script type="module" crossorigin src="/little-racing-v2-test/assets/index-Mr4aRDC9.js"></script>
    <link rel="modulepreload" crossorigin href="/little-racing-v2-test/assets/BufferGeometryUtils-B1nfbDRm.js">
    <link rel="modulepreload" crossorigin href="/little-racing-v2-test/assets/textures-I-J0jN-O.js">
    <link rel="modulepreload" crossorigin href="/little-racing-v2-test/assets/model-MAgXfVWW.js">
    <link rel="modulepreload" crossorigin href="/little-racing-v2-test/assets/GLTFLoader-BaXP2m-J.js">
    <link rel="modulepreload" crossorigin href="/little-racing-v2-test/assets/characters-JSHsc6MV.js">
    <link rel="modulepreload" crossorigin href="/little-racing-v2-test/assets/preload-helper-DpUcS5yN.js">
    <link rel="stylesheet" crossorigin href="/little-racing-v2-test/assets/index-C4_NI67l.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="ui"></div>
    </div>
    <!-- Static markup so it paints on first frame: the procedural world build
         is synchronous and takes several seconds on a phone. The artwork already
         contains the title, subtitle and the "正在进入赛道……" hint, so the only
         thing layered on top is the real progress bar — one bar, no duplicates. -->
    <div id="boot">
      <div class="bootBg" aria-hidden="true"></div>
      <div class="bootArt">
        <img class="bootImg" src="/little-racing-v2-test/assets/boot-a6bVA9dg.jpg" alt="小小赛车 · 快乐卡丁车冒险" />
        <div
          class="bootBar"
          role="progressbar"
          aria-label="加载进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <i id="bootFill"></i>
        </div>
      </div>
    </div>
  </body>
</html>
