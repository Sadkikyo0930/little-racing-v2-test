name: Deploy chapter 2 voice preview
on:
  push:
    branches: [main]
    paths: ['dist-preview/**', 'preview-sha256.json', '.github/workflows/r4-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r4-preview-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Sadkikyo0930/little-racing-v2-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact supplied preview files
        run: |
          python3 - <<'PY'
          import json, hashlib, re
          from pathlib import Path
          p = Path('dist-preview')
          expected = json.loads(Path('preview-sha256.json').read_text())
          actual = {str(f.relative_to(p)): hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file()}
          assert actual == expected, 'Preview checksum mismatch'
          voices = sorted(p.rglob('c2-*.mp3'))
          assert len(voices) == 21, len(voices)
          voice_ids = [re.fullmatch(r'c2-(\d{2})(?:-[A-Za-z0-9_-]+)?\.mp3', f.name) for f in voices]
          assert all(voice_ids), 'Invalid chapter 2 voice filename'
          assert sorted(m.group(1) for m in voice_ids) == [f'{i:02}' for i in range(1, 22)], 'Chapter 2 voices must contain 01-21 exactly once'
          assert '/little-racing-v2-test/assets/' in (p / 'index.html').read_text()
          assert any('lrv2test' in f.read_text() for f in p.glob('assets/*.js'))
          print(f'PASS: {len(actual)} exact build files; 21 chapter 2 voices; isolated test path and save prefix')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-preview
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
