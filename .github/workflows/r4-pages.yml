name: Deploy verified R4 preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r4-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r4-preview-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Sadkikyo0930/little-racing-v2-test'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Require exact R4 commit and successful source test job
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'Sadkikyo0930';
            const repo = 'little-racing-v2';
            const run_id = 42381160483;
            for (let attempt = 0; attempt < 360; attempt++) {
              const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
              if (run.head_sha !== '965f0445b1fe036cbfe251a9887bc98da0ad5a80' || run.head_branch !== 'develop' || run.event !== 'push') throw new Error('Source identity mismatch');
              const {data} = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id});
              const test = data.jobs.find(job => job.name === 'test');
              if (test?.status === 'completed') {
                if (test.conclusion !== 'success') throw new Error('Source regression failed: ' + test.conclusion);
                core.info('Exact R4 source test job passed; deploying its verified artifact.');
                return;
              }
              core.info('Waiting for source regression, attempt ' + (attempt + 1));
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            throw new Error('Timed out waiting for source regression');
      - uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: preview-dist
          repository: Sadkikyo0930/little-racing-v2
          run-id: 42381160483
          github-token: ${{ github.token }}
      - name: Verify isolated entry path
        run: |
          test -s preview-dist/index.html
          grep -q '/little-racing-v2-test/' preview-dist/index.html
          if grep -q '/little-racing-v2/' preview-dist/index.html; then exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
